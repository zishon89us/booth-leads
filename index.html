<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Opening…</title>
<script>
// Old address kept alive for links and QR codes already shared; tracking tags are passed along.
var p = new URLSearchParams(location.search);
var dest = p.has("staff") ? "booth/" : p.get("f") === "healthcare" ? "healthcare/" : "assessment/";
p.delete("staff");
p.delete("f");
var q = p.toString();
location.replace("" + dest + (q ? "?" + q : ""));
</script>
